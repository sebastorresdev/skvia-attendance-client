<nz-layout class="h-screen flex flex-row overflow-hidden bg-gray-100 dark:bg-black transition-colors duration-200">
  <!-- Sidebar -->
  <nz-sider
    class="relative z-20 h-screen overflow-y-auto shadow-md transition-all duration-300 border-r border-gray-200/50 dark:border-gray-800"
    nzCollapsible nzWidth="256px" nzBreakpoint="md" [(nzCollapsed)]="isCollapsed" [nzTrigger]="null">

    <!-- Sidebar Logo Header -->
    <div
      class="h-16 px-4 flex items-center gap-3 bg-[#001529] dark:bg-[#141414]! transition-colors overflow-hidden border-b border-gray-800/40">
      <div
        class="shrink-0 w-9 h-9 bg-linear-to-br from-blue-500 via-indigo-600 to-purple-600 rounded-lg flex items-center justify-center shadow-md shadow-blue-500/20">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-white">
          <path d="M12 2L2 7l10 5 10-5-10-5z" />
          <path d="M2 17l10 5 10-5" />
          <path d="M2 12l10 5 10-5" />
        </svg>
      </div>
      @if (!isCollapsed) {
      <span class="text-white font-bold text-sm tracking-wider truncate">SKVIA - ASISTENCIA</span>
      }
    </div>

    <!-- Navigation Menu -->
    <ul nz-menu nzTheme="dark" nzMode="inline" [nzInlineCollapsed]="isCollapsed"
      class="h-[calc(100vh-64px)] overflow-y-auto">
      @for (group of menu; track $index) {
        @if (hasGroupPermission(group)) {
          <li nz-submenu nzOpen [nzTitle]="group.title" [nzIcon]="group.icon">
            <ul>
              @for (item of group.children; track $index) {
              <li nz-menu-item nzMatchRouter *appHasPermission="item.permission">
                <a [routerLink]="item.link">{{ item.label }}</a>
              </li>
              }
            </ul>
          </li>
        }
      }
    </ul>
  </nz-sider>

  <!-- Main Content Layout -->
  <nz-layout
    class="flex-1 flex flex-col h-screen overflow-hidden bg-gray-100 dark:bg-black transition-colors duration-200">
    <!-- Top Header -->
    <nz-header
      class="p-0! h-16! bg-white! dark:bg-[#141414]! border-b border-gray-200 dark:border-gray-800 shadow-xs z-10 transition-colors">
      <div class="h-16 px-4 flex items-center justify-between">
        <!-- Collapse Trigger -->
        <button nz-button nzType="text" (click)="isCollapsed = !isCollapsed"
          class="flex! items-center justify-center w-10! h-10! rounded-lg! text-gray-600 hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer"
          title="Colapsar menú">
          <nz-icon [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'" class="text-xl" />
        </button>

        <!-- Actions (Theme Toggle Button) -->
        <div class="flex items-center gap-3">
          <button nz-button nzType="text" (click)="themeService.toggleTheme()"
            class="flex! items-center gap-2 px-3.5! py-1.5! rounded-lg! text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800 transition-all cursor-pointer border border-gray-200 dark:border-gray-700 shadow-xs"
            title="Cambiar tema">
            <nz-icon [nzType]="themeService.currentTheme() === 'theme-dark' ? 'sun' : 'moon'"
              class="text-lg text-amber-500 dark:text-blue-400" />
            <span class="text-xs font-semibold select-none hidden sm:inline">
              {{ themeService.currentTheme() === 'theme-dark' ? 'Modo Claro' : 'Modo Oscuro' }}
            </span>
          </button>

          <!-- Logout Button -->
          <button nz-button nzType="text" (click)="auth.logout()"
            class="flex! items-center gap-2 px-3.5! py-1.5! rounded-lg! text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 transition-all cursor-pointer border border-red-200 dark:border-red-800 shadow-xs"
            title="Cerrar sesión">
            <nz-icon nzType="logout" class="text-lg" />
            <span class="text-xs font-semibold select-none hidden sm:inline">Cerrar Sesión</span>
          </button>
        </div>
      </div>
    </nz-header>

    <!-- Page Content Container (CUADRADO: sin rounded) -->
    <nz-content class="m-6! flex-1 overflow-y-auto">
      <div
        class="p-6 bg-white dark:bg-[#141414] text-gray-900 dark:text-gray-100 shadow-xs border border-gray-200/80 dark:border-gray-800 min-h-[calc(100vh-112px)] transition-colors">
        <router-outlet></router-outlet>
      </div>
    </nz-content>
  </nz-layout>
</nz-layout>
