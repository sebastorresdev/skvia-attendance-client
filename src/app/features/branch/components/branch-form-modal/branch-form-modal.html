<form nz-form [formGroup]="form" (ngSubmit)="submitForm()">
  <nz-form-item>
    <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="code">Código</nz-form-label>
    <nz-form-control [nzSm]="18" [nzXs]="24" nzErrorTip="Por favor ingrese el código de la sede (máx 10 caracteres)">
      <input nz-input id="code" formControlName="code" placeholder="Ej: LIM-01" class="uppercase" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="name">Nombre</nz-form-label>
    <nz-form-control [nzSm]="18" [nzXs]="24" nzErrorTip="Por favor ingrese el nombre de la sede">
      <input nz-input id="name" formControlName="name" placeholder="Nombre de la sede" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="address">Dirección</nz-form-label>
    <nz-form-control [nzSm]="18" [nzXs]="24">
      <textarea nz-input id="address" formControlName="address" rows="3" placeholder="Dirección física (opcional)"></textarea>
    </nz-form-control>
  </nz-form-item>

  <div *nzModalFooter>
    <button nz-button nzType="default" (click)="destroyModal()" type="button">Cancelar</button>
    <button nz-button nzType="primary" [nzLoading]="loading()" (click)="submitForm()">Guardar</button>
  </div>
</form>
