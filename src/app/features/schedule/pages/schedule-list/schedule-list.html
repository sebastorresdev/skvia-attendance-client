<!-- HEADER -->
<header class="flex flex-row justify-between">
  <!-- TITULO -->
  <div class="flex flex-row items-start gap-3">
    <nz-icon class="text-4xl" nzType="clock-circle"></nz-icon>
    <h1 class="mb-0! text-base font-medium">Turnos Base</h1>
  </div>
  <!-- ACCIONES -->
  <div class="flex flex-col gap-2 items-end">
    <!-- BOTONES -->
    <div class="flex flex-row items-center gap-1">
      <button nz-button nzType="text" (click)="loadSchedules()">
        <nz-icon nzType="reload" />
        Refresh
      </button>
      <button nz-button nzType="text" (click)="openNewScheduleModal()">
        <nz-icon nzType="plus" />
        Nuevo
      </button>
    </div>
    <!-- FILTROS -->
    <div class="flex flex-row gap-1">
      <nz-space-compact>
        <nz-input-wrapper>
          <input nz-input placeholder="Buscar turno..." nzVariant="underlined" [ngModel]="search()" (ngModelChange)="search.set($event)" />
          <nz-icon nzInputSuffix nzType="search" />
        </nz-input-wrapper>
      </nz-space-compact>
    </div>
  </div>
</header>

<!-- SEPARACION -->
<br />

<!-- TABLE -->
<nz-table 
  #basicTable 
  nzShowSizeChanger 
  [nzData]="filteredSchedules()"
>
  <thead>
    <tr>
      <th>Acciones</th>
      <th>Nombre</th>
      <th>Hora Entrada</th>
      <th>Hora Salida</th>
    </tr>
  </thead>
  <tbody>
    @for (data of basicTable.data; track data.id) {
    <tr>
      <td>
        <button nz-button nz-dropdown [nzDropdownMenu]="menu">
          <span nz-icon nzType="edit"></span>
        </button>
        <nz-dropdown-menu #menu="nzDropdownMenu">
          <ul nz-menu>
            <li nz-menu-item (click)="openEditScheduleModal(data)">Editar</li>
            <li nz-menu-item nzDanger (click)="showDeleteConfirm(data)">Eliminar</li>
          </ul>
        </nz-dropdown-menu>
      </td>
      <td class="font-medium">{{ data.name }}</td>
      <td>{{ data.defaultStartTime }}</td>
      <td>{{ data.defaultEndTime }}</td>
    </tr>
    }
  </tbody>
</nz-table>
