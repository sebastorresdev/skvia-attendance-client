<form nz-form [formGroup]="scheduleForm" (ngSubmit)="submitForm()" nzLayout="vertical">
  <div class="grid grid-cols-2 gap-4">
    <nz-form-item>
      <nz-form-label [nzSm]="24" [nzXs]="24" nzRequired nzFor="code">Código del Turno</nz-form-label>
      <nz-form-control [nzSm]="24" [nzXs]="24" nzErrorTip="Requerido">
        <input nz-input formControlName="code" id="code" placeholder="Ej: MAT" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSm]="24" [nzXs]="24" nzRequired nzFor="timeZoneId">Zona Horaria</nz-form-label>
      <nz-form-control [nzSm]="24" [nzXs]="24" nzErrorTip="Requerido">
        <nz-select formControlName="timeZoneId">
          <nz-option *ngFor="let tz of timeZones" [nzValue]="tz.value" [nzLabel]="tz.label"></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>
  </div>

  <nz-form-item>
    <nz-form-label [nzSm]="24" [nzXs]="24" nzRequired nzFor="description">Descripción</nz-form-label>
    <nz-form-control [nzSm]="24" [nzXs]="24" nzErrorTip="Por favor ingrese la descripción">
      <input nz-input formControlName="description" id="description" placeholder="Ej: Turno Mañana" />
    </nz-form-control>
  </nz-form-item>

  <div class="grid grid-cols-2 gap-4">
    <nz-form-item>
      <nz-form-label [nzSm]="24" [nzXs]="24" nzRequired nzFor="defaultStartTime">Hora de Entrada</nz-form-label>
      <nz-form-control [nzSm]="24" [nzXs]="24" nzErrorTip="Requerido">
        <input nz-input type="time" formControlName="defaultStartTime" class="w-full" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSm]="24" [nzXs]="24" nzRequired nzFor="defaultEndTime">Hora de Salida</nz-form-label>
      <nz-form-control [nzSm]="24" [nzXs]="24" nzErrorTip="Requerido">
        <input nz-input type="time" formControlName="defaultEndTime" class="w-full" />
      </nz-form-control>
    </nz-form-item>
  </div>

  <nz-form-item class="mb-2">
    <nz-form-control>
      <label nz-checkbox formControlName="hasBreak">Tiene Break</label>
    </nz-form-control>
  </nz-form-item>

  <div class="grid grid-cols-2 gap-4" *ngIf="scheduleForm.get('hasBreak')?.value">
    <nz-form-item>
      <nz-form-label [nzSm]="24" [nzXs]="24" nzRequired nzFor="breakStartTime">Inicio Break</nz-form-label>
      <nz-form-control [nzSm]="24" [nzXs]="24" nzErrorTip="Requerido">
        <input nz-input type="time" formControlName="breakStartTime" class="w-full" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSm]="24" [nzXs]="24" nzRequired nzFor="breakEndTime">Fin Break</nz-form-label>
      <nz-form-control [nzSm]="24" [nzXs]="24" nzErrorTip="Requerido">
        <input nz-input type="time" formControlName="breakEndTime" class="w-full" />
      </nz-form-control>
    </nz-form-item>
  </div>

  <div class="flex justify-end gap-2 mt-4">
    <button nz-button type="button" (click)="cancel()">Cancelar</button>
    <button nz-button nzType="primary" [nzLoading]="isLoading()" type="submit">
      Guardar
    </button>
  </div>
</form>
