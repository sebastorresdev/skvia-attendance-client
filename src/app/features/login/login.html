
<div class="min-h-screen w-full flex items-center justify-center bg-gray-50 dark:bg-gray-950 px-4 relative overflow-hidden">

  <!-- Blobs decorativos de fondo -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-400/20 dark:bg-blue-600/10 rounded-full blur-3xl"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-purple-400/20 dark:bg-purple-600/10 rounded-full blur-3xl"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-125 h-125 bg-indigo-300/10 dark:bg-indigo-600/5 rounded-full blur-3xl"></div>

  <div class="relative w-full max-w-md rounded-2xl shadow-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 overflow-hidden">

    <!-- Barra superior de acento -->
    <div class="h-1.5 w-full bg-linear-to-r from-blue-600 via-indigo-600 to-purple-600"></div>

    <div class="p-8 sm:p-10">
      <!-- Logo y nombre -->
      <div class="flex flex-col items-center text-center mb-8">
        <div class="w-16 h-16 bg-linear-to-br from-blue-600 via-indigo-600 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/25 mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-white">
            <path d="M12 2L2 7l10 5 10-5-10-5z" />
            <path d="M2 17l10 5 10-5" />
            <path d="M2 12l10 5 10-5" />
          </svg>
        </div>

        <span class="text-4xl font-black bg-linear-to-r from-blue-600 via-indigo-600 to-purple-600 dark:from-blue-500 dark:via-indigo-400 dark:to-purple-400 bg-clip-text text-transparent tracking-wide">
          SKVIA
        </span>

        <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">
          Ingresa tus credenciales para acceder al sistema
        </p>
      </div>

      <!-- Formulario -->
      <form nz-form [formGroup]="validateForm" (ngSubmit)="submitForm()" class="flex flex-col gap-4">

        <!-- Usuario -->
        <nz-form-item class="mb-0!">
          <nz-form-control nzErrorTip="Ingresa tu usuario">
            <nz-input-wrapper>
              <nz-icon nzInputPrefix nzType="user" class="opacity-50" />
              <input nzSize="large" type="text" nz-input formControlName="userName" placeholder="Usuario" autocomplete="username" />
            </nz-input-wrapper>
          </nz-form-control>
        </nz-form-item>

        <!-- Contraseña -->
        <nz-form-item class="mb-0!">
          <nz-form-control nzErrorTip="Ingresa tu contraseña">
            <nz-input-password>
              <nz-icon nzInputPrefix nzType="lock" class="opacity-50" />
              <input nzSize="large" nz-input formControlName="password" placeholder="Contraseña" autocomplete="current-password" />
            </nz-input-password>
          </nz-form-control>
        </nz-form-item>

        <!-- Recordarme + Olvidé contraseña -->
        <div class="flex items-center justify-between">
          <label nz-checkbox formControlName="remember" class="text-sm!">
            <span class="text-gray-400">Recordarme</span>
          </label>
          <a class="text-sm font-medium text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300 transition-colors">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <!-- Botón de ingreso -->
        <button
          nz-button
          nzType="primary"
          nzSize="large"
          nzBlock
          class="rounded-lg! font-semibold! bg-linear-to-r! from-blue-600! via-indigo-600! to-purple-600! border-none!">
          Ingresar
        </button>
      </form>

      <!-- Footer -->
      <p class="text-center text-xs text-gray-400 dark:text-gray-600 mt-8">
        © {{ currentYear }} SKVIA Company. Todos los derechos reservados.
      </p>
    </div>
  </div>
</div>
