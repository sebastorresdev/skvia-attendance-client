<div class="flex flex-row items-center justify-between">
  <nz-breadcrumb>
    <nz-breadcrumb-item>
      <a [routerLink]="['/kiosk-devices']">Dispositivos Kiosko</a>
    </nz-breadcrumb-item>
    <nz-breadcrumb-item>Vincular Nuevo</nz-breadcrumb-item>
  </nz-breadcrumb>

  <div class="flex gap-2">
    <button nz-button type="button" routerLink="/kiosk-devices">Cancelar</button>
    <button nz-button nzType="primary" (click)="submitForm()" [nzLoading]="isSubmitting()">Vincular Dispositivo</button>
  </div>
</div>

<nz-divider class="my-4!" />

<div class="max-w-3xl">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Vincular Nuevo Dispositivo</h1>
    <p class="text-gray-500">Autoriza a este dispositivo para que los empleados puedan registrar su asistencia.</p>
  </div>

  <nz-card>
    <form nz-form [formGroup]="form" nzLayout="vertical">
      <nz-form-item>
        <nz-form-label nzRequired>Nombre del Dispositivo</nz-form-label>
        <nz-form-control nzErrorTip="Por favor ingresa un nombre para identificar el dispositivo">
          <input nz-input formControlName="name" placeholder="Ej: Tablet Recepción Principal" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item class="mb-0">
        <nz-form-label nzRequired>Sede Asignada</nz-form-label>
        <nz-form-control nzErrorTip="Por favor selecciona la sede donde estará este dispositivo">
          <nz-select formControlName="branchId" nzPlaceHolder="Selecciona una sede" [nzLoading]="isLoadingBranches()">
            <nz-option *ngFor="let branch of branches()" [nzValue]="branch.id" [nzLabel]="branch.name"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </form>
  </nz-card>
</div>
