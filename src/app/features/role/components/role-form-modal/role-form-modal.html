<nz-modal
  [nzVisible]="visible"
  [nzTitle]="role ? 'Editar Rol' : 'Nuevo Rol'"
  (nzOnCancel)="handleCancel()"
  (nzOnOk)="handleOk()"
  [nzOkLoading]="isSaving"
  nzOkText="Guardar"
  nzCancelText="Cancelar">
  <ng-container *nzModalContent>
    <form nz-form [formGroup]="form" nzLayout="vertical">
      
      <!-- Nombre -->
      <nz-form-item>
        <nz-form-label nzRequired>Nombre del rol</nz-form-label>
        <nz-form-control nzErrorTip="Por favor ingrese un nombre válido">
          <input nz-input formControlName="name" placeholder="Ej: Vendedor" />
        </nz-form-control>
      </nz-form-item>

      <!-- Descripción -->
      <nz-form-item>
        <nz-form-label>Descripción</nz-form-label>
        <nz-form-control>
          <textarea nz-input formControlName="description" placeholder="Descripción del rol" [nzAutosize]="{ minRows: 3, maxRows: 5 }"></textarea>
        </nz-form-control>
      </nz-form-item>

    </form>
  </ng-container>
</nz-modal>
